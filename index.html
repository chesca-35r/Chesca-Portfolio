<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chesca's Portfolio</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:linear-gradient(135deg,#6a0dad,#9b59b6,#d8b4fe);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    background:white;
    width:100%;
    max-width:800px;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

h1{
    color:#6a0dad;
    margin-bottom:10px;
}

p{
    color:#444;
    margin-bottom:20px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
}

button{
    background:#8e44ad;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#6a0dad;
}

#content{
    margin-top:25px;
    padding:20px;
    background:#f3e8ff;
    border-radius:15px;
}

img{
    width:150px;
    border-radius:50%;
    margin-bottom:15px;
}

@media(max-width:600px){
    h1{
        font-size:28px;
    }

    button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>💜 CHESCA'S PORTFOLIO 💜</h1>

    <p>Welcome to my digital world ✨</p>

    <div class="buttons">
        <button onclick="about()">About Me</button>
        <button onclick="hobbies()">Hobbies</button>
        <button onclick="interests()">Interests</button>
    </div>

    <div id="content">
        Click a button above! 💜
    </div>

</div>

<script>

function about(){
document.getElementById("content").innerHTML=
`
<h2>About Me</h2>
<p>Hello! I'm Chesca.</p>
<p>I love learning new things and creating fun projects.</p>
`;
}

function hobbies(){
document.getElementById("content").innerHTML=
`
<h2>My Hobbies</h2>
<p>🧶 Crochet</p>
<p>💻 Coding</p>
<p>🎵 Listening to Music</p>
`;
}

function interests(){
document.getElementById("content").innerHTML=
`
<h2>My Interests</h2>
<p>✨ Technology</p>
<p>🎨 Creative Activities</p>
<p>📚 Learning New Skills</p>
`;
}

</script>

</body>
</html>
